<div class="modal-overlay" *ngIf="isVisible$ | async" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <h4>Notificación de AeroReservas</h4>
    <p>{{ message$ | async }}</p>

    <div class="modal-actions" *ngIf="isConfirm$ | async; else alertButtons">
      <button class="btn-secondary" (click)="close()">Cancelar</button>
      <button class="btn-primary" (click)="confirm()">Confirmar</button>
    </div>

    <ng-template #alertButtons>
      <div class="modal-actions">
        <button class="btn-primary" (click)="close()">Aceptar</button>
      </div>
    </ng-template>
    
  </div>
</div>
