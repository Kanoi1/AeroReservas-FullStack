<div class="container">
  <div class="form-card">
    <h2>Crear Cuenta</h2>
    <p>Únete a AeroReservas para empezar a planificar tu viaje.</p>

    <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="credentials.email"
          required
          email
          #emailField="ngModel"
        >
        <div *ngIf="emailField.invalid && emailField.touched" class="error-message">
          <span *ngIf="emailField.errors?.['required']">El correo es obligatorio.</span>
          <span *ngIf="emailField.errors?.['email']">Por favor, introduce un correo válido.</span>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          minlength="6"
          #passwordField="ngModel"
        >
        <div *ngIf="passwordField.invalid && passwordField.touched" class="error-message">
          <span *ngIf="passwordField.errors?.['required']">La contraseña es obligatoria.</span>
          <span *ngIf="passwordField.errors?.['minlength']">Debe tener al menos 6 caracteres.</span>
        </div>
      </div>

      <button type="submit" [disabled]="registerForm.invalid">Registrar</button>

    </form>

    <div class="footer-text">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </div>
  </div>
</div>
