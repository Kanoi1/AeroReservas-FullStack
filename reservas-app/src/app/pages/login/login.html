<div class="container">
  <div class="form-card">
    <h2>Iniciar Sesión</h2>
    <p>Bienvenido de nuevo a AeroReservas.</p>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="credentials.email"
          required
          email
          #emailField="ngModel"
        >
        <div *ngIf="emailField.invalid && emailField.touched" class="error-message">
          Por favor, introduce un correo válido.
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          minlength="6"
          #passwordField="ngModel"
        >
        <div *ngIf="passwordField.invalid && passwordField.touched" class="error-message">
          La contraseña es obligatoria.
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Ingresar</button>

    </form>

    <div class="footer-text">
      ¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a>
    </div>
  </div>
</div>
